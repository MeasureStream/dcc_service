spring.application.name=dcc-service

# Database Configuration - Using PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/SENSORS}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:measurestream_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aaaa}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Schema Configuration
spring.jpa.properties.hibernate.default_schema=dcc
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# Logging
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASIC_BINDER:TRACE}

# Server Port
server.port=${SERVER_PORT:8080}

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

# Service URLs
gemimeg.backend.url=${GEMIMEG_BACKEND_URL:http://gemimeg-backend:8080}
gateway.iam.url=${GATEWAY_IAM_URL:http://gateway-iam:8080}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
