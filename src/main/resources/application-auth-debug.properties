# ============================================================
# Profilo: auth-debug
# Uso: aggiungere -Dspring.profiles.active=auth-debug al lancio
#   mvn spring-boot:run -Dspring-boot.run.profiles=auth-debug
#
# Effetti:
#   - Nessuna autenticazione richiesta su qualsiasi endpoint
#   - Ogni richiesta viene trattata come utente "debug-admin-user" con ruolo ROLE_app-admin
#   - La validazione JWT di Keycloak è disabilitata
#   - Kafka e S3 usano gli indirizzi Tailscale (fuori Docker)
# ============================================================

# Disabilita la validazione JWT (non serve issuer-uri valido)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration

# Kafka fuori Docker (Tailscale)
spring.kafka.bootstrap-servers=100.78.181.75:9092

# S3/Garage fuori Docker (Tailscale)
aws.s3.endpoint=http://100.127.76.43:3900

# Log livello info per non sommergere l'output
logging.level.root=INFO
logging.level.de.ptb.dcc=DEBUG
