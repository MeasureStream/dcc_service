spring.application.name=dcc-service

# Database Configuration - Using PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://100.127.76.43:32768/SENSORS}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:measurestream_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aaaa}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# Schema Configuration - Using public schema
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.defer-datasource-initialization=true

# SQL initialization (runs schema.sql after Hibernate DDL for migrations)
spring.sql.init.mode=always
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}

# Logging
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASIC_BINDER:TRACE}

# Server Port
server.port=${SERVER_PORT:8080}

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

# Service URLs
gemimeg.backend.url=${GEMIMEG_BACKEND_URL:http://gemimeg-backend:10001}
gateway.iam.url=${GATEWAY_IAM_URL:http://gateway-iam:8080}

# Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:https://auth.christiandellisanti.uk/realms/measurestream-dev}

# Kafka Configuration
# Inside Docker  : kafka:29092   (set via KAFKA_BOOTSTRAP_SERVERS env var in compose)
# Outside Docker : 100.78.181.75:9092  (Tailscale / external)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:100.127.76.43:9092}
spring.kafka.consumer.group-id=dcc-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Calibration topics
# CONSUMING  →  calibration.request   (raw export from calibrator hardware)
# PRODUCING  →  calibration.response  (computed calibration constants)
calibration.topic.request=${CALIBRATION_TOPIC_REQUEST:calibration.request}
calibration.topic.response=${CALIBRATION_TOPIC_RESPONSE:calibration.response}
calibration.consumer.group=${CALIBRATION_CONSUMER_GROUP:dcc-service-calibration-request}

# S3 / Garage Configuration
aws.s3.endpoint=${S3_ENDPOINT:http://garage:3900}
aws.s3.bucket=${S3_BUCKET:dccs}
aws.s3.public-url=${S3_PUBLIC_URL:https://dev.christiandellisanti.uk/s3/dccs}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_REGION:garage}

# Python Bridge
# PYTHON_CMD: python executable name (default: python)
# PYTHON_SCRIPT_PATH: filesystem path to build_input_json.py
#   Leave empty to auto-extract from classpath (default behaviour)
python.cmd=${PYTHON_CMD:python}
python.script.path=${PYTHON_SCRIPT_PATH:}

# Calibration run settings
# CALIBRATION_SCRIPT_PATH: absolute path to analisi_calib_data.py
# CALIBRATION_MODELS_PATH: absolute path to calibration/models_in/
# CALIBRATION_RUNS_PATH: absolute path to the runs output directory (created if absent)
calibration.script.path=${CALIBRATION_SCRIPT_PATH:}
calibration.models.path=${CALIBRATION_MODELS_PATH:}
calibration.runs.path=${CALIBRATION_RUNS_PATH:./calibration-runs}
